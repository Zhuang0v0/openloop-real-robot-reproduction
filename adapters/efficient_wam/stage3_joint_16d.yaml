# Optional Stage 3 follow-up after a validated Stage 2 export.
system: stage3_joint
training_stage: stage3
name: building_block_towers_stage3_16d
max_steps: 1000
per_device_batch_size: 1
gradient_accumulation_steps: 8
action_learning_rate: 5.0e-6
video_learning_rate: 1.0e-6
weight_decay: 1.0e-3
min_lr_ratio: 0.00001
num_workers: 2
pin_memory: true
prefetch_factor: 2
persistent_workers: true
checkpoint_dir: __RUN_ROOT__/efficient_wam_checkpoints
checkpoint_interval: 500
checkpoint_total_limit: 2
log_interval: 10
report_to: tensorboard
resume_from: ""

performance:
  reuse_condition_latent_from_clean: true
  verify_condition_latent_reuse: true

dataset:
  root: __RUN_ROOT__/efficient_wam_train_dataset_16d
  type: efficient_wam_train
  max_open_shards: 4
  validate_runtime: true
  language_policy: first
  sampling:
    mode: per_episode_random
    samples_per_episode: 32
    seed: 2026

model:
  compact_wan_checkpoint: __MODEL_ROOT__/Efficient-WAM-RT_compact_16d.pt
  # Stage 2 export, not the unadapted 14D RT export.
  action_init_checkpoint: __STAGE2_CHECKPOINT__
  compact_wan:
    checkpoint_path: __WAN_MODEL_ROOT__
    config_path: __WAN_MODEL_ROOT__
    vae_path: __WAN_MODEL_ROOT__/Wan2.2_VAE.pth
    precision: bfloat16
    dim: 2048
    ffn_dim: 8192
    num_heads: 16
    num_layers: 12
    head_dim: 128
    future_video_size: [192, 160]
  action_expert:
    dim: 768
    ffn_dim: 3072
    num_layers: 12
    chunk_size: 16
    # Dataset order: L1..L7, Lgrip, R1..R7, Rgrip. The adapted RT
    # checkpoint maps its RoboTwin [L1..L6,Lgrip,R1..R6,Rgrip] channels to
    # indices [0,1,2,3,4,5,7,8,9,10,11,12,13,15].
    state_dim: 16
    action_dim: 16
  wan_frozen: false

loss:
  type: mot_joint_flow_matching
  action_weight: 1.0
  video_weight: 0.01
